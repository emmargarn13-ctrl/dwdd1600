<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Emma Garn">
    <meta name="description" content="The go-to for cooking basics">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Chop n' Chill: Tools</title>
</head>

<body>
    <!--Page head-->
    <header>
        <span>Chop n' Chill</span>
    </header>
    <!--Page nav-->
    <nav>
        <ul>
            <li>
                <a href="index.html">Tools</a>
            </li>
            <li>
                <a href="recipes.html">Easy Recipes</a>
            </li>
            <li>
                <a href="knowledge.html">What to know</a>
            </li>
            <li class="active">
                <a href="suggestions.html">Suggestions</a>
            </li>
        </ul>


    </nav>
    <!--Main content-->
    <main>
        <h1>Suggestions</h1>
        <form method="get" class="form" action="thanks.html">
            <fieldset>
                <legend>Customer Information</legend>
                <label>First Name* <input type="text" name="fname" required></label>
                <label>Last Name* <input type="text" name="lname" required></label>
                <label>Phone Number* <input type="tel" name="phone" required placeholder="123-456-7890"></label>
                <label>Email <input type="email" name="email" placeholder="user@example.com"></label>
              <label>Have you cooked before this?</label>
                <select name="cooked">
                    <option value="none">Select Please</option>
                    <option value="little">Kind of but not really</option>
                    <option value="no">Not at all</option>
                    <option value="occasionally">Occasionally</option>
                    <option value="Yes">Quite Often</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Did this help?</legend>
                <label><input type="radio" name="method" value="yes">Yes</label>
                <label><input type="radio" name="method" value="no">No</label>
                <label><input type="radio" name="method" value="maybe">Sort of</label>
            </fieldset>
            <fieldset>
            <legend>What tools did you get?</legend>
            <label><input type="checkbox" name="chef_knife" value="checked">Chef's Knife</label>

            <label><input type="checkbox" name="pairing_knife" value="checked">Pairing Knife</label>

            <label><input type="checkbox" name="serrated_knife" value="checked">Serrated Knife</label>

            <label><input type="checkbox" name="cutting_board" value="checked">Cutting Board</label>

            <label><input type="checkbox" name="nonstick_skillet" value="checked">Nonstick Skillet</label>

            <label><input type="checkbox" name="saucepan" value="checked">Saucepan</label>

            <label><input type="checkbox" name="large_pot" value="checked">Large Pot</label>

            <label><input type="checkbox" name="baking_sheet" value="checked">Baking Sheet</label>

            <label><input type="checkbox" name="wooden_spoon" value="checked">Wooden Spoon</label>

            <label><input type="checkbox" name="spatula" value="checked">Spatula</label>

            <label><input type="checkbox" name="tongs" value="checked">Tongs</label>

            <label><input type="checkbox" name="whisk" value="checked">Whisk</label>

            <label><input type="checkbox" name="can_opener" value="checked">Can Opener</label>

            <label><input type="checkbox" name="vegetable_peeler" value="checked">Vegetable Peeler</label>

            <label><input type="checkbox" name="mixing_bowls" value="checked">Mixing bowls</label>

            <label><input type="checkbox" name="measuring_cups" value="checked">Measuring Cups</label>

            <label><input type="checkbox" name="measuring_spoons" value="checked">Measuring Spoons</label>

            <label><input type="checkbox" name="colander" value="checked">Colander</label>

            <label><input type="checkbox" name="food_thermometer" value="checked">Food Thermometer</label>

            <label><input type="checkbox" name="oven_mitts" value="checked">Oven Mitts</label>
                </fieldset>
            <label>Questions
                <textarea name="comments" placeholder="Put any questions here"></textarea>
            </label>
            <label>
            <input type="submit" value="Send Suggestion">
            </label>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 &bull; Emma Garn &bull; Web Essentials</p>
    </footer>
</body>

</html>
